name: release-windows

# Builds the single-file Windows app (drover.exe) when a tag like v0.1.0 is pushed, and attaches it to the GitHub release.
# The landing page links to releases/latest/download/drover.exe, so the asset name must stay "drover.exe".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v5
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"${GITHUB_REF_NAME#v}\"/" src/drover/__init__.py
          sed -i "0,/^version = .*/s//version = \"${GITHUB_REF_NAME#v}\"/" pyproject.toml  # read by the Rust build
      - name: Build web UI
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Build drover.exe
        run: |
          uv sync --extra tui  # bundle Textual so plain `dr` opens the terminal UI
          uv run pyinstaller packaging/drover.spec --noconfirm
      - name: Rust toolchain (rust/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: rust
      - name: Build Rust dr.exe (fast agent commands + the daemon)
        # Default `server` feature: drover.exe's `server run` hands over to this dr.exe (Rust daemon), Python stays the
        # fallback. crt-static: dr.exe sits at the runtime root, where Windows can't see _internal\VCRUNTIME140.dll.
        shell: bash
        working-directory: rust
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked -p drover-cli
          cp target/release/dr.exe ../dist/drover-cli/dr.exe
      - name: Check output
        shell: bash
        run: |
          test -s dist/drover.exe && ls -l dist/drover.exe
          dist/drover-cli/dr-py.exe --help > /dev/null
          dist/drover-cli/dr.exe --help > /dev/null  # delegated to dr-py.exe
          test -z "$(dist/drover-cli/dr.exe ls --names)"  # fast path, no daemon: prints nothing, exit 0
      - name: Smoke test (Rust daemon from the runtime folder)
        shell: bash
        run: |
          export DROVER_STATE_DIR="$RUNNER_TEMP/drover-smoke" DROVER_CONFIG_DIR="$RUNNER_TEMP/drover-smoke-config"
          mkdir -p "$DROVER_STATE_DIR" "$DROVER_CONFIG_DIR"
          dist/drover-cli/dr.exe server run --background &
          for i in $(seq 1 50); do test -s "$DROVER_STATE_DIR/daemon.json" && break; sleep 0.2; done
          port=$(jq -r .port "$DROVER_STATE_DIR/daemon.json")
          grep -q '"engine": *"rust"' <(curl -fsS -H "Authorization: Bearer $(jq -r .token "$DROVER_STATE_DIR/daemon.json")" \
            -d '{"method":"server.info","params":{}}' "http://127.0.0.1:$port/rpc")
          curl -fsS -o /dev/null "http://127.0.0.1:$port/"  # web UI found in _internal/drover/web_dist
          dist/drover-cli/dr.exe ls
          dist/drover-cli/dr.exe server stop
      - name: Zip fast CLI runtime
        # dr.exe + dr-py.exe at the zip root: the daemon extracts them into <state>/runtime/<version>/
        shell: pwsh
        run: Compress-Archive -Path dist/drover-cli/* -DestinationPath dist/drover-cli-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: drover-windows-x64
          path: |
            dist/drover.exe
            dist/drover-cli-windows-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}  # v1.2.3-rc.1: test build, not offered as an update
          files: |
            dist/drover.exe
            dist/drover-cli-windows-x64.zip
