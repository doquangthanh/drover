name: release-windows

# Builds the Windows release folder (same as Linux: dr, dr-py, drover, drover-native) when a tag like v0.1.0 is
# pushed: drover-windows-x64.zip (+ .sha256) and the download drover.exe (the Tauri window, which installs the
# folder on first run). The landing page links to releases/latest/download/drover.exe: keep that asset name.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v5
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"${GITHUB_REF_NAME#v}\"/" src/drover/__init__.py
          sed -i "0,/^version = .*/s//version = \"${GITHUB_REF_NAME#v}\"/" pyproject.toml  # read by the Rust build
      - name: Build web UI
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Build dr-py (Python CLI + TUI)
        run: |
          uv sync --extra tui  # bundle Textual so plain `dr` opens the terminal UI
          uv run pyinstaller packaging/drover.spec --noconfirm
      - name: Rust toolchain (rust/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: rust
      - name: Build Rust dr.exe (fast agent commands + the daemon)
        # Default `server` feature: dr.exe is also the daemon. crt-static: dr.exe sits at the folder root, where
        # Windows can't see _internal\VCRUNTIME140.dll.
        shell: bash
        working-directory: rust
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked -p drover-cli
          cp target/release/dr.exe ../dist/drover/dr.exe
      - name: Build Rust window and the native window preview (same crates as Linux)
        shell: bash
        working-directory: rust
        env:
          DROVER_RELEASE: "1"  # a downloaded drover.exe may install the release folder (launcher.rs)
        run: |
          cargo build --release --locked -p drover-desktop -p drover-desktop-native
          cp target/release/drover.exe target/release/drover-native.exe ../dist/drover/
          cp target/release/*.dll ../dist/drover/ 2>/dev/null || true  # WebView2Loader.dll when not linked statically
          cp target/release/drover.exe ../dist/drover.exe  # the download: installs the folder on first run
      - name: Check output
        shell: bash
        run: |
          test -s dist/drover.exe && ls -l dist/drover.exe
          test -s dist/drover/drover.exe && test -s dist/drover/drover-native.exe
          dist/drover/dr-py.exe --help > /dev/null
          dist/drover/dr.exe --help > /dev/null  # delegated to dr-py.exe
          test -z "$(dist/drover/dr.exe ls --names)"  # fast path, no daemon: prints nothing, exit 0
      - name: Smoke test (Rust daemon from the runtime folder)
        shell: bash
        run: |
          export DROVER_STATE_DIR="$RUNNER_TEMP/drover-smoke" DROVER_CONFIG_DIR="$RUNNER_TEMP/drover-smoke-config"
          mkdir -p "$DROVER_STATE_DIR" "$DROVER_CONFIG_DIR"
          dist/drover/dr.exe server run --background &
          for i in $(seq 1 50); do test -s "$DROVER_STATE_DIR/daemon.json" && break; sleep 0.2; done
          port=$(jq -r .port "$DROVER_STATE_DIR/daemon.json")
          grep -q '"engine": *"rust"' <(curl -fsS -H "Authorization: Bearer $(jq -r .token "$DROVER_STATE_DIR/daemon.json")" \
            -d '{"method":"server.info","params":{}}' "http://127.0.0.1:$port/rpc")
          curl -fsS -o /dev/null "http://127.0.0.1:$port/"  # web UI found in _internal/drover/web_dist
          dist/drover/dr.exe ls
          dist/drover/dr.exe server stop
      - name: Package (same layout as Linux)
        shell: pwsh
        run: |
          Compress-Archive -Path dist/drover -DestinationPath dist/drover-windows-x64.zip
          $h = (Get-FileHash dist/drover-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  drover-windows-x64.zip" | Out-File -Encoding ascii -NoNewline dist/drover-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: drover-windows-x64
          path: |
            dist/drover.exe
            dist/drover-windows-x64.zip*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}  # v1.2.3-rc.1: test build, not offered as an update
          files: |
            dist/drover.exe
            dist/drover-windows-x64.zip
            dist/drover-windows-x64.zip.sha256
