name: release-linux

# Builds the Linux bundle when a tag like v0.1.0 is pushed, and attaches it (with its SHA-256) to the GitHub release.
# Hybrid bundle: Python `dr` (CLI + TUI, PyInstaller) + Rust `drover` (Tauri window) + Rust `drover-server` (daemon).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-22.04 }        # old glibc: the binaries run on most distros
          - { arch: arm64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v5
      - name: System libraries for the Tauri window (WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Rust toolchain (rust/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: rust
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"${GITHUB_REF_NAME#v}\"/" src/drover/__init__.py
          sed -i "0,/^version = .*/s//version = \"${GITHUB_REF_NAME#v}\"/" pyproject.toml  # read by the Rust build
      - name: Build web UI
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Build Python dr
        run: |
          # Textual so plain `dr` opens the terminal UI. Qt is left out: the Linux bundle uses the Rust window
          # (packaging/drover.spec excludes it), and PyQt6 has no aarch64 wheel for this glibc.
          uv sync --extra tui --no-install-package pyqt6 --no-install-package pyqt6-qt6 --no-install-package pyqt6-sip \
            --no-install-package pyqt6-webengine --no-install-package pyqt6-webengine-qt6 --no-install-package qtpy
          uv run pyinstaller packaging/drover.spec --noconfirm
      - name: Build Rust window and daemon
        run: cargo build --release --locked -p drover-cli -p drover-desktop
        working-directory: rust
      - name: Assemble bundle
        run: |
          install -m 755 rust/target/release/dr dist/drover/drover-server
          install -m 755 rust/target/release/drover dist/drover/drover
          ln -s dr dist/drover/hd  # old CLI name, kept so agents and scripts that call `hd` still work
      - name: Smoke test (Python dr starts the Rust daemon)
        run: |
          export DROVER_STATE_DIR="$(mktemp -d)" DROVER_CONFIG_DIR="$(mktemp -d)"
          dist/drover/dr --help >/dev/null
          dist/drover/dr server start
          dist/drover/dr status
          grep -q '"engine": *"rust"' <(curl -fsS -H "Authorization: Bearer $(jq -r .token "$DROVER_STATE_DIR/daemon.json")" \
            -d '{"method":"server.info","params":{}}' "http://127.0.0.1:$(jq -r .port "$DROVER_STATE_DIR/daemon.json")/rpc")
          dist/drover/dr server stop
      - name: Package
        run: |
          tar -czf drover-linux-${{ matrix.arch }}.tar.gz -C dist drover
          sha256sum drover-linux-${{ matrix.arch }}.tar.gz > drover-linux-${{ matrix.arch }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: drover-linux-${{ matrix.arch }}
          path: drover-linux-${{ matrix.arch }}.tar.gz*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            drover-linux-${{ matrix.arch }}.tar.gz
            drover-linux-${{ matrix.arch }}.tar.gz.sha256
