name: release-linux

# Builds the Linux binaries when a tag like v0.1.0 is pushed, and attaches them to the GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-22.04 }        # old glibc: the binary runs on most distros
          - { arch: arm64, runner: ubuntu-24.04-arm }  # PyQt6-Qt6 aarch64 wheels need glibc >= 2.39
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v5
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i "s/__version__ = \".*\"/__version__ = \"${GITHUB_REF_NAME#v}\"/" src/drover/__init__.py
      - name: Build web UI
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Build binaries
        run: |
          uv sync --extra tui  # bundle Textual so plain `dr` opens the terminal UI
          uv run pyinstaller packaging/drover.spec --noconfirm
      - name: Smoke test
        run: dist/drover/dr --help
      - name: Package
        run: |
          ln -s dr dist/drover/hd  # old CLI name, kept so agents and scripts that call `hd` still work
          tar -czf drover-linux-${{ matrix.arch }}.tar.gz -C dist drover
      - uses: actions/upload-artifact@v4
        with:
          name: drover-linux-${{ matrix.arch }}
          path: drover-linux-${{ matrix.arch }}.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: drover-linux-${{ matrix.arch }}.tar.gz
